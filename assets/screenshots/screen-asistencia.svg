            <path d="M 294 4 L 298 8 L 294 12" stroke="#9DA5B4" stroke-width="1.5" fill="none" />
          </g>

          <text x="0" y="36" fill="#E2E6EE" font-size="13" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif">Sistemas Distribuidos</text>

          <g transform="translate(0, 48)">
            <rect x="0" y="4" width="244" height="6" rx="3" fill="#161B26" />
            <rect x="0" y="4" width="183" height="6" rx="3" fill="#DC2626" />
            <text x="300" y="12" fill="#F87171" font-size="13" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif" text-anchor="end">75.0%</text>
          </g>

          <g transform="translate(0, 72)">
            <rect x="0" y="0" width="304" height="26" rx="8" fill="#DC2626" fill-opacity="0.12" />
            <circle cx="106" cy="13" r="5" fill="#DC2626" />
            <path d="M 104 11 L 108 15 M 108 11 L 104 15" stroke="#FFFFFF" stroke-width="1.2" />
            <text x="120" y="17" fill="#F87171" font-size="11" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif">2 Faltas (1 restante)</text>
          </g>

          <g transform="translate(0, 110)">
            <circle cx="11" cy="11" r="11" fill="#161B26" /><text x="11" y="15" fill="#9DA5B4" font-size="10" font-family="sans-serif" text-anchor="middle">L</text>
            <circle cx="39" cy="11" r="11" fill="#7C3AED" /><text x="39" y="15" fill="#FFFFFF" font-size="10" font-weight="700" font-family="sans-serif" text-anchor="middle">M</text>
            <circle cx="67" cy="11" r="11" fill="#161B26" /><text x="67" y="15" fill="#9DA5B4" font-size="10" font-family="sans-serif" text-anchor="middle">M</text>
            <circle cx="95" cy="11" r="11" fill="#161B26" /><text x="95" y="15" fill="#9DA5B4" font-size="10" font-family="sans-serif" text-anchor="middle">J</text>
            <circle cx="123" cy="11" r="11" fill="#7C3AED" /><text x="123" y="15" fill="#FFFFFF" font-size="10" font-weight="700" font-family="sans-serif" text-anchor="middle">V</text>
            <circle cx="151" cy="11" r="11" fill="#161B26" /><text x="151" y="15" fill="#9DA5B4" font-size="10" font-family="sans-serif" text-anchor="middle">S</text>
          </g>
        </g>
      </g>
    </g>

    <!-- ==========================================
         BOTTOM NAVIGATION BAR (Asistencia activo con indicator)
         ========================================== -->
    <g transform="translate(15, 680)">
      <rect x="0" y="0" width="350" height="70" fill="#12161F" />
      <line x1="0" y1="0" x2="350" y2="0" stroke="#232936" stroke-width="1" />

      <!-- Tab 1: Hoy -->
      <g transform="translate(20, 8)">
        <g transform="translate(19, 4)">
          <rect x="0" y="1" width="16" height="15" rx="2" fill="none" stroke="#9DA5B4" stroke-width="1.4" />
        </g>
        <text x="27" y="39" fill="#9DA5B4" font-size="11" font-family="'Plus Jakarta Sans', Roboto, sans-serif" text-anchor="middle">Hoy</text>
      </g>

      <!-- Tab 2: Cursos -->
      <g transform="translate(86, 8)">
        <g transform="translate(19, 4)">
          <path d="M 8 1 L 0 5 L 8 9 L 16 5 Z M 3 7.5 L 3 12 C 3 14 8 16 8 16 C 8 16 13 14 13 12 L 13 7.5" fill="none" stroke="#9DA5B4" stroke-width="1.4" stroke-linejoin="round" />
        </g>
        <text x="27" y="39" fill="#9DA5B4" font-size="11" font-family="'Plus Jakarta Sans', Roboto, sans-serif" text-anchor="middle">Cursos</text>
      </g>

      <!-- Tab 3: Horario -->
      <g transform="translate(152, 8)">
        <g transform="translate(19, 4)">
          <circle cx="8" cy="8" r="7" fill="none" stroke="#9DA5B4" stroke-width="1.4" />
          <path d="M 8 4 L 8 8 L 11 8" stroke="#9DA5B4" stroke-width="1.4" stroke-linecap="round" />
        </g>
        <text x="27" y="39" fill="#9DA5B4" font-size="11" font-family="'Plus Jakarta Sans', Roboto, sans-serif" text-anchor="middle">Horario</text>
      </g>

      <!-- Tab 4: Asistencia (SELECCIONADO: Pill indicator activo) -->
      <g transform="translate(218, 8)">
        <rect x="4" y="0" width="46" height="26" rx="13" fill="#163478" />
        <g transform="translate(19, 4)">
          <rect x="0" y="1" width="16" height="15" rx="2" fill="none" stroke="#D6E2FF" stroke-width="1.4" />
          <line x1="4" y1="8" x2="12" y2="8" stroke="#D6E2FF" stroke-width="1.4" />
        </g>
        <text x="27" y="39" fill="#7BA5FF" font-size="11" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif" text-anchor="middle">Asistencia</text>
      </g>

      <!-- Tab 5: Canvas -->
      <g transform="translate(284, 8)">
        <g transform="translate(19, 4)">
          <rect x="1" y="2" width="14" height="14" rx="2" fill="none" stroke="#9DA5B4" stroke-width="1.4" />
        </g>
        <text x="27" y="39" fill="#9DA5B4" font-size="11" font-family="'Plus Jakarta Sans', Roboto, sans-serif" text-anchor="middle">Canvas</text>
      </g>
    </g>
  </g>
</svg>
