    </g>

    <!-- ==========================================
         BOTTOM NAVIGATION BAR OFICIAL (HomeScreen.kt)
         5 Tabs: Hoy | Cursos | Horario | Asistencia | Canvas (ACTIVO)
         ========================================== -->
    <g transform="translate(15, 680)">
      <rect x="0" y="0" width="350" height="70" fill="#12161F" />
      <line x1="0" y1="0" x2="350" y2="0" stroke="#232936" stroke-width="1" />

      <!-- Tab 1: Hoy -->
      <g transform="translate(20, 8)">
        <g transform="translate(19, 4)">
          <rect x="0" y="1" width="16" height="15" rx="2" fill="none" stroke="#9DA5B4" stroke-width="1.4" />
          <path d="M 4 8 L 7 11 L 12 5" fill="none" stroke="#9DA5B4" stroke-width="1.5" stroke-linecap="round" />
        </g>
        <text x="27" y="39" fill="#9DA5B4" font-size="11" font-family="'Plus Jakarta Sans', Roboto, sans-serif" text-anchor="middle">Hoy</text>
      </g>

      <!-- Tab 2: Cursos -->
      <g transform="translate(86, 8)">
        <g transform="translate(19, 4)">
          <path d="M 8 1 L 0 5 L 8 9 L 16 5 Z M 3 7.5 L 3 12 C 3 14 8 16 8 16 C 8 16 13 14 13 12 L 13 7.5" fill="none" stroke="#9DA5B4" stroke-width="1.4" stroke-linejoin="round" />
        </g>
        <text x="27" y="39" fill="#9DA5B4" font-size="11" font-family="'Plus Jakarta Sans', Roboto, sans-serif" text-anchor="middle">Cursos</text>
      </g>

      <!-- Tab 3: Horario -->
      <g transform="translate(152, 8)">
        <g transform="translate(19, 4)">
          <circle cx="8" cy="8" r="7" fill="none" stroke="#9DA5B4" stroke-width="1.4" />
          <path d="M 8 4 L 8 8 L 11 8" stroke="#9DA5B4" stroke-width="1.4" stroke-linecap="round" />
        </g>
        <text x="27" y="39" fill="#9DA5B4" font-size="11" font-family="'Plus Jakarta Sans', Roboto, sans-serif" text-anchor="middle">Horario</text>
      </g>

      <!-- Tab 4: Asistencia -->
      <g transform="translate(218, 8)">
        <g transform="translate(19, 4)">
          <circle cx="8" cy="5" r="3.5" fill="none" stroke="#9DA5B4" stroke-width="1.4" />
          <path d="M 2 15 C 2 11.5 5 10 8 10 C 11 10 14 11.5 14 15" fill="none" stroke="#9DA5B4" stroke-width="1.4" stroke-linecap="round" />
        </g>
        <text x="27" y="39" fill="#9DA5B4" font-size="11" font-family="'Plus Jakarta Sans', Roboto, sans-serif" text-anchor="middle">Asistencia</text>
      </g>

      <!-- Tab 5: Canvas (SELECCIONADO: Indicator Pill activo) -->
      <g transform="translate(284, 8)">
        <rect x="4" y="0" width="46" height="26" rx="13" fill="#163478" />
        <g transform="translate(19, 4)">
          <path d="M 8 2 L 1 6 L 8 10 L 15 6 Z M 3 8 L 3 12 C 3 14 8 15.5 8 15.5 C 8 15.5 13 14 13 12 L 13 8" fill="none" stroke="#D6E2FF" stroke-width="1.4" />
        </g>
        <text x="27" y="39" fill="#7BA5FF" font-size="11" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif" text-anchor="middle">Canvas</text>
      </g>
    </g>

    <!-- Barra de Gestos Android -->
    <rect x="145" y="746" width="90" height="4" rx="2" fill="#4B5563" />
  </g>
</svg>
