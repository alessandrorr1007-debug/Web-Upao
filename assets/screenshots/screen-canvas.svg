<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="100%" height="100%">
  <defs>
    <!-- Filtro sombra de teléfono -->
    <filter id="phoneShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <clipPath id="screenClip">
      <rect x="15" y="15" width="350" height="750" rx="36" />
    </clipPath>
  </defs>

  <!-- Chasis del Smartphone (Material 3 Dark Frame) -->
  <rect x="10" y="10" width="360" height="760" rx="40" fill="#1A1F2C" stroke="#2D3548" stroke-width="4" filter="url(#phoneShadow)" />

  <g clip-path="url(#screenClip)">
    <!-- Fondo de pantalla (UpaoBackgroundDark = #0D1117) -->
    <rect x="15" y="15" width="350" height="750" fill="#0D1117" />

    <!-- Barra de Estado Android (Status Bar) -->
    <text x="36" y="42" fill="#E2E6EE" font-size="12" font-family="'Plus Jakarta Sans', Roboto, sans-serif" font-weight="600">09:41</text>
    <!-- Cámara frontal / Punch Hole -->
    <circle cx="190" cy="38" r="6" fill="#000" />
    <!-- Iconos de conexión / batería -->
    <circle cx="316" cy="38" r="3" fill="#E2E6EE" />
    <path d="M 324 41 L 330 35 L 336 41 Z" fill="#E2E6EE" />
    <rect x="340" y="34" width="16" height="8" rx="2" fill="none" stroke="#E2E6EE" stroke-width="1.5" />
    <rect x="342" y="36" width="10" height="4" rx="1" fill="#16A34A" />

    <!-- ==========================================
         TOP APP BAR OFICIAL (HomeScreen.kt: Tab Canvas)
         Menú | "Canvas LMS" | Theme | Calc | Notif | Settings
         ========================================== -->
    <g transform="translate(24, 60)">
      <!-- Hamburger Menu Icon -->
      <g transform="translate(0, 4)">
        <line x1="0" y1="2" x2="18" y2="2" stroke="#E2E6EE" stroke-width="2" stroke-linecap="round" />
        <line x1="0" y1="8" x2="18" y2="8" stroke="#E2E6EE" stroke-width="2" stroke-linecap="round" />
        <line x1="0" y1="14" x2="18" y2="14" stroke="#E2E6EE" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Título de pantalla -->
      <text x="30" y="17" fill="#E2E6EE" font-size="20" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif">Canvas LMS</text>

      <!-- Acciones a la derecha -->
      <g transform="translate(210, 4)">
        <!-- Theme Toggle (Moon) -->
        <path d="M 9 1 A 7 7 0 1 0 15 11 A 8 8 0 0 1 9 1 Z" fill="none" stroke="#9DA5B4" stroke-width="1.6" />
        <!-- Calculadora (Plus/Minus/Equal) -->
        <g transform="translate(32, 0)">
          <rect x="0" y="0" width="16" height="16" rx="3" fill="none" stroke="#9DA5B4" stroke-width="1.4" />
          <line x1="3" y1="8" x2="13" y2="8" stroke="#9DA5B4" stroke-width="1.3" />
          <line x1="8" y1="3" x2="8" y2="13" stroke="#9DA5B4" stroke-width="1.3" />
        </g>
        <!-- Notificaciones (Bell con badge) -->
        <g transform="translate(64, 0)">
          <path d="M 8 2 A 4 4 0 0 0 4 6 L 4 10 L 2 12 L 14 12 L 12 10 L 12 6 A 4 4 0 0 0 8 2 Z M 6.5 13 A 1.5 1.5 0 0 0 9.5 13" fill="none" stroke="#9DA5B4" stroke-width="1.4" />
          <circle cx="13" cy="2" r="3.5" fill="#EF4444" />
        </g>
        <!-- Settings (Gear) -->
        <g transform="translate(96, 0)">
          <circle cx="8" cy="8" r="3.5" fill="none" stroke="#9DA5B4" stroke-width="1.4" />
          <path d="M 8 1 L 8 3 M 8 13 L 8 15 M 1 8 L 3 8 M 13 8 L 15 8" stroke="#9DA5B4" stroke-width="1.4" stroke-linecap="round" />
        </g>
      </g>
    </g>

    <!-- ==========================================
         CANVAS HUB HEADER (CanvasScreen.kt: CanvasContent)
         Canvas LMS Hub | Estado Sincronizado | Botón de Token (Key)
         ========================================== -->
    <g transform="translate(24, 102)">
      <g transform="translate(0, 0)">
        <text x="0" y="14" fill="#E2E6EE" font-size="16" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif">Canvas LMS Hub</text>
        <g transform="translate(0, 22)">
          <circle cx="4" cy="5" r="3.5" fill="#22C55E" />
          <text x="14" y="8" fill="#22C55E" font-size="11" font-weight="600" font-family="'Plus Jakarta Sans', Roboto, sans-serif">Conectado a Canvas UPAO</text>
          <text x="160" y="8" fill="#9DA5B4" font-size="11" font-family="'Plus Jakarta Sans', Roboto, sans-serif">• Actualizado hace 8 min</text>
        </g>
      </g>

      <!-- Botón de Token / Credenciales Canvas (Key Icon) -->
      <g transform="translate(296, -2)">
        <circle cx="18" cy="18" r="18" fill="#1E3A8A" fill-opacity="0.4" stroke="#2563EB" stroke-width="1" />
        <g transform="translate(10, 10)">
          <circle cx="5" cy="5" r="3.5" fill="none" stroke="#93C5FD" stroke-width="1.5" />
          <path d="M 8 8 L 14 14 M 11 11 L 13 9 M 13 13 L 15 11" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round" />
        </g>
      </g>
    </g>

    <!-- ==========================================
         SCROLLABLE TAB ROW (CanvasScreen.kt)
         Cursos (5) | Pendientes (3) [Activo] | Notifs (2) | Bandeja
         ========================================== -->
    <g transform="translate(24, 150)">
      <!-- Tab 0: Cursos -->
      <g transform="translate(0, 0)">
        <path d="M 8 2 L 1 6 L 8 10 L 15 6 Z M 3 8 L 3 12 C 3 14 8 15.5 8 15.5 C 8 15.5 13 14 13 12 L 13 8" fill="none" stroke="#9DA5B4" stroke-width="1.3" />
        <text x="20" y="12" fill="#9DA5B4" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', Roboto, sans-serif">Cursos</text>
        <rect x="66" y="1" width="16" height="14" rx="7" fill="#232936" />
        <text x="74" y="11" fill="#9DA5B4" font-size="9" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif" text-anchor="middle">5</text>
      </g>

      <!-- Tab 1: Pendientes (ACTIVO con Badge y Underline) -->
      <g transform="translate(94, 0)">
        <rect x="0" y="2" width="12" height="14" rx="2" fill="none" stroke="#3B82F6" stroke-width="1.3" />
        <line x1="3" y1="6" x2="9" y2="6" stroke="#3B82F6" stroke-width="1.3" />
        <text x="18" y="12" fill="#3B82F6" font-size="12" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif">Pendientes</text>
        <rect x="88" y="1" width="16" height="14" rx="7" fill="#2563EB" />
        <text x="96" y="11" fill="#FFFFFF" font-size="9" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif" text-anchor="middle">3</text>
        <!-- Línea indicadora activa (Primary) -->
        <rect x="-4" y="22" width="114" height="2.5" rx="1.2" fill="#3B82F6" />
      </g>

      <!-- Tab 2: Notificaciones -->
      <g transform="translate(216, 0)">
        <path d="M 7 1 A 3 3 0 0 0 4 4 L 4 7 L 2 9 L 12 9 L 10 7 L 10 4 A 3 3 0 0 0 7 1 Z" fill="none" stroke="#9DA5B4" stroke-width="1.2" />
        <text x="16" y="12" fill="#9DA5B4" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', Roboto, sans-serif">Avisos</text>
        <rect x="58" y="1" width="16" height="14" rx="7" fill="#EF4444" />
        <text x="66" y="11" fill="#FFFFFF" font-size="9" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif" text-anchor="middle">2</text>
      </g>

      <!-- Tab 3: Bandeja -->
      <g transform="translate(298, 0)">
        <rect x="0" y="2" width="14" height="10" rx="2" fill="none" stroke="#9DA5B4" stroke-width="1.2" />
        <path d="M 0 3 L 7 8 L 14 3" fill="none" stroke="#9DA5B4" stroke-width="1.2" />
        <text x="18" y="12" fill="#9DA5B4" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', Roboto, sans-serif">Bandeja</text>
