    <!-- Línea divisoria del TabRow -->
    <line x1="15" y1="174" x2="365" y2="174" stroke="#232936" stroke-width="1" />

    <!-- ==========================================
         LISTA DE PENDIENTES (CanvasTodoItemCard.kt)
         ========================================== -->
    <!-- Card 1: Tarea Urgente (Vence Hoy) -->
    <g transform="translate(24, 186)">
      <rect x="0" y="0" width="332" height="146" rx="16" fill="#161B26" stroke="#232936" stroke-width="1" />
      <g transform="translate(14, 14)">
        <!-- Tag superior: Curso Chip + Badge TAREA -->
        <g transform="translate(0, 0)">
          <!-- Course chip -->
          <rect x="0" y="0" width="148" height="22" rx="6" fill="#1E3A8A" fill-opacity="0.3" />
          <path d="M 8 4 L 4 6.5 L 8 9 L 12 6.5 Z" fill="none" stroke="#60A5FA" stroke-width="1.2" />
          <text x="18" y="15" fill="#93C5FD" font-size="10" font-weight="600" font-family="'Plus Jakarta Sans', Roboto, sans-serif">Sistemas Distribuidos</text>
        </g>
        <g transform="translate(242, 0)">
          <!-- Badge Tarea (Morado Canvas) -->
          <rect x="0" y="0" width="62" height="22" rx="11" fill="#EDE7F6" />
          <circle cx="10" cy="11" r="3" fill="#673AB7" />
          <text x="20" y="15" fill="#673AB7" font-size="9.5" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif">TAREA</text>
