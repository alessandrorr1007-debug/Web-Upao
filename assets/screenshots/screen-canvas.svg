        <!-- Título de la tarea -->
        <text x="0" y="44" fill="#E2E6EE" font-size="13" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif">
          Laboratorio 3: Configuración de Clúster
        </text>
        <text x="0" y="60" fill="#E2E6EE" font-size="13" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif">
          Kubernetes y Helm Charts en Cloud
        </text>

        <!-- Fila de Vencimiento y Puntos -->
        <g transform="translate(0, 80)">
          <!-- Calendario icono -->
          <rect x="0" y="1" width="13" height="13" rx="2" fill="none" stroke="#EF4444" stroke-width="1.3" />
          <line x1="0" y1="5" x2="13" y2="5" stroke="#EF4444" stroke-width="1.3" />
          <!-- formatCanvasDueDate: esMismoDia -> Vence hoy a las... en UpaoRed -->
          <text x="18" y="11" fill="#EF4444" font-size="11.5" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif">Vence hoy a las 23:59</text>
          <text x="304" y="11" fill="#9DA5B4" font-size="11.5" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif" text-anchor="end">20 pts</text>
        </g>

        <!-- Prompt interactivo nativo -->
        <text x="304" y="114" fill="#3B82F6" font-size="10.5" font-weight="600" font-family="'Plus Jakarta Sans', Roboto, sans-serif" text-anchor="end">
          Tocar para ver detalle e instrucciones ›
        </text>
      </g>
    </g>

    <!-- Card 2: Examen Próximo (Vence Mañana) -->
    <g transform="translate(24, 344)">
      <rect x="0" y="0" width="332" height="146" rx="16" fill="#161B26" stroke="#232936" stroke-width="1" />
      <g transform="translate(14, 14)">
        <!-- Tag superior: Curso Chip + Badge EXAMEN -->
        <g transform="translate(0, 0)">
          <!-- Course chip -->
          <rect x="0" y="0" width="156" height="22" rx="6" fill="#064E3B" fill-opacity="0.3" />
          <path d="M 8 4 L 4 6.5 L 8 9 L 12 6.5 Z" fill="none" stroke="#34D399" stroke-width="1.2" />
          <text x="18" y="15" fill="#6EE7B7" font-size="10" font-weight="600" font-family="'Plus Jakarta Sans', Roboto, sans-serif">Ingeniería De Software II</text>
        </g>
        <g transform="translate(236, 0)">
          <!-- Badge Examen (Rojo) -->
          <rect x="0" y="0" width="68" height="22" rx="11" fill="#FFEBEE" />
          <circle cx="10" cy="11" r="3" fill="#D32F2F" />
          <text x="20" y="15" fill="#D32F2F" font-size="9.5" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif">EXAMEN</text>
        </g>

        <!-- Título del examen -->
        <text x="0" y="44" fill="#E2E6EE" font-size="13" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif">
          Evaluación Continua 2: Patrones
        </text>
        <text x="0" y="60" fill="#E2E6EE" font-size="13" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif">
          Arquitecturales y Microservicios
        </text>

        <!-- Fila de Vencimiento y Puntos -->
        <g transform="translate(0, 80)">
          <rect x="0" y="1" width="13" height="13" rx="2" fill="none" stroke="#F97316" stroke-width="1.3" />
          <line x1="0" y1="5" x2="13" y2="5" stroke="#F97316" stroke-width="1.3" />
          <text x="18" y="11" fill="#F97316" font-size="11.5" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif">Vence mañana a las 18:00</text>
          <text x="304" y="11" fill="#9DA5B4" font-size="11.5" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif" text-anchor="end">20 pts</text>
        </g>

        <text x="304" y="114" fill="#3B82F6" font-size="10.5" font-weight="600" font-family="'Plus Jakarta Sans', Roboto, sans-serif" text-anchor="end">
          Rendir evaluación en línea ›
        </text>
      </g>
    </g>

    <!-- Card 3: Tarea en 3 días (Vence en 3 días) -->
    <g transform="translate(24, 502)">
      <rect x="0" y="0" width="332" height="146" rx="16" fill="#161B26" stroke="#232936" stroke-width="1" />
      <g transform="translate(14, 14)">
        <g transform="translate(0, 0)">
          <!-- Course chip -->
          <rect x="0" y="0" width="144" height="22" rx="6" fill="#4C1D95" fill-opacity="0.3" />
          <path d="M 8 4 L 4 6.5 L 8 9 L 12 6.5 Z" fill="none" stroke="#C084FC" stroke-width="1.2" />
          <text x="18" y="15" fill="#D8B4FE" font-size="10" font-weight="600" font-family="'Plus Jakarta Sans', Roboto, sans-serif">Inteligencia Artificial</text>
        </g>
        <g transform="translate(242, 0)">
          <rect x="0" y="0" width="62" height="22" rx="11" fill="#EDE7F6" />
          <circle cx="10" cy="11" r="3" fill="#673AB7" />
          <text x="20" y="15" fill="#673AB7" font-size="9.5" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif">TAREA</text>
        </g>

        <text x="0" y="44" fill="#E2E6EE" font-size="13" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif">
          Entrega de Avance: Fine-Tuning de
        </text>
        <text x="0" y="60" fill="#E2E6EE" font-size="13" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif">
          Modelos con LoRA y QLoRA
        </text>

        <g transform="translate(0, 80)">
          <rect x="0" y="1" width="13" height="13" rx="2" fill="none" stroke="#EAB308" stroke-width="1.3" />
          <line x1="0" y1="5" x2="13" y2="5" stroke="#EAB308" stroke-width="1.3" />
          <text x="18" y="11" fill="#EAB308" font-size="11.5" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif">Vence en 3 días (23:59)</text>
          <text x="304" y="11" fill="#9DA5B4" font-size="11.5" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif" text-anchor="end">20 pts</text>
        </g>

        <text x="304" y="114" fill="#3B82F6" font-size="10.5" font-weight="600" font-family="'Plus Jakarta Sans', Roboto, sans-serif" text-anchor="end">
          Subir archivo de entrega ›
        </text>
