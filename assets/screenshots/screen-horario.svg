    <!-- Status Bar -->
    <text x="36" y="42" fill="#E2E6EE" font-size="12" font-family="'Plus Jakarta Sans', Roboto, sans-serif" font-weight="600">09:41</text>
    <circle cx="190" cy="38" r="6" fill="#000" />
    <circle cx="316" cy="38" r="3" fill="#E2E6EE" />
    <path d="M 324 41 L 330 35 L 336 41 Z" fill="#E2E6EE" />
    <rect x="340" y="34" width="16" height="8" rx="2" fill="none" stroke="#E2E6EE" stroke-width="1.5" />
    <rect x="342" y="36" width="10" height="4" rx="1" fill="#16A34A" />

    <!-- ==========================================
         TOP APP BAR (HomeScreen.kt: Page 2 = "Horario")
         ========================================== -->
    <g transform="translate(24, 62)">
      <g transform="translate(4, 6)">
