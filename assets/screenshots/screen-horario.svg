          <text x="22" y="18" fill="#9DA5B4" font-size="10" font-weight="500" font-family="'Plus Jakarta Sans', Roboto, sans-serif" text-anchor="middle">mié</text>
          <text x="22" y="38" fill="#E2E6EE" font-size="15" font-weight="700" font-family="'Plus Jakarta Sans', Roboto, sans-serif" text-anchor="middle">21</text>
        </g>

